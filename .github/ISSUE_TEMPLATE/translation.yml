name: Translation Contribution
description: Optionally coordinate translation work in this fork
title: "Contribution | Translation: "
labels: ["contribution", "translate"]
body:
  - type: markdown
    attributes:
      value: |
        Use this optional issue to coordinate translation work. Check this fork’s existing issues for overlap and follow docs/LANGUAGE.md for technical guidance.
  - type: input
    id: language
    attributes:
      label: Language
      description: The language you want to translate (e.g., Japanese, Korean, French, German)
      placeholder: e.g., Japanese
    validations:
      required: true
  - type: input
    id: locale-code
    attributes:
      label: Locale Code
      description: BCP 47 locale code (e.g., ja, ko, fr, de, pt-BR)
      placeholder: e.g., ja
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any relevant details (e.g., regional variant, partial translation, timeline)
      placeholder: Optional
    validations:
      required: false
